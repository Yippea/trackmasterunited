<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TrackMaster United</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07090d;
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
      }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #07090d; outline: none; touch-action: none; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse 70% 55% at 50% 42%, #1b2230 0%, #07090d 72%);
        font-family: "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif; color: #fff;
        transition: opacity .4s;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      .logo { font-size: clamp(32px, 8vw, 84px); font-style: italic; font-weight: 900; letter-spacing: -1px; line-height: 1; }
      .logo small { display: block; margin-top: .25em; font-size: .3em; letter-spacing: .55em; text-align: right; color: #6fd3ff; }
      .bar { width: min(460px, 70vw); height: 6px; margin-top: 42px; background: rgba(255,255,255,.12); transform: skewX(-24deg); overflow: hidden; }
      .fill { width: 0; height: 100%; background: #fff; transition: width .15s linear; }
      .pct { margin-top: 12px; font-size: 13px; font-style: italic; letter-spacing: .2em; color: rgba(255,255,255,.55); }
      #error { position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; font: 14px sans-serif; color: #ff8a7a; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div class="logo">TRACKMASTER<small>UNITED</small></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div id="error"></div>

    <script>
      // iOS suspends/interrupts WebAudio: resume every context on the next user gesture.
      (function () {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var contexts = [];
        function Tracked(opts) { var c = new AC(opts); contexts.push(c); return c; }
        Tracked.prototype = AC.prototype;
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
        ['touchend', 'click', 'keydown'].forEach(function (t) {
          document.addEventListener(t, function () {
            contexts.forEach(function (c) { if (c.state !== 'running' && c.state !== 'closed') c.resume(); });
          }, true);
        });
      })();

    </script>

    <script src="Build/trackmaster_united-v2(build-15).loader.js"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                   (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      window.addEventListener('keydown', function (e) {
        // arrows / space / backspace must drive the car, not scroll or navigate the page
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Backspace'].indexOf(e.key) >= 0 && e.target === canvas) e.preventDefault();
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/trackmaster_united-v2(build-15).data",
        frameworkUrl: "Build/trackmaster_united-v2(build-15).framework.js",
        codeUrl: "Build/trackmaster_united-v2(build-15).wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TrackMaster",
        productName: "TrackMaster United",
        productVersion: "2.0.0",
        autoSyncPersistentDataPath: true,
        // phones: cap the render resolution so the frame rate stays high
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2),
      }, function (progress) {
        var p = Math.round(progress * 100);
        try { if (window.GamePix && window.GamePix.loading) window.GamePix.loading(p); } catch (e) {}
        document.getElementById('fill').style.width = p + '%';
        document.getElementById('pct').textContent = p + '%';
      }).then(function (instance) {
        window.unityInstance = instance;
        document.getElementById('loader').classList.add('done');
        canvas.focus();
      }).catch(function (message) {
        document.getElementById('error').textContent = message;
      });
    </script>
  </body>
</html>
